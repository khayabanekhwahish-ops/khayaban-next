[build]
  # Clear any cached .next/cache first: Next.js persists fetched data across
  # builds for incremental-build speed, which otherwise serves stale Sanity
  # content after a Studio edit even though this is a fresh static export.
  command = "rm -rf .next/cache && npm run build"
  publish = "out"

[build.environment]
  # This is a static export (output: 'export'), so we want plain static
  # hosting + Netlify Forms, not Netlify's auto-installed Next.js Runtime
  # (which serves everything through Functions and swallows form POSTs).
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
